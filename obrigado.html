    <style>
        /* ========================================================
           RESET E BASE
           ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #FAF8F5;
            color: #2F2F2F;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* ========================================================
           CONTAINER DOS CONFETES
           ======================================================== */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confettiFall linear forwards;
            opacity: 0.9;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
        
        /* ========================================================
           CONTAINER PRINCIPAL
           ======================================================== */
        .thanks-container {
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            animation: fadeInUp 0.8s ease forwards;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }
        
        .thanks-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8A6F5A, #D8C3A5, #8A6F5A);
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* ========================================================
           ÍCONE DE SUCESSO
           ======================================================== */
        .thanks-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8A6F5A, #B08D57);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: white;
            margin: 0 auto 25px;
            animation: pulseIcon 2s ease-in-out infinite;
            box-shadow: 0 8px 30px rgba(138,111,90,0.3);
        }
        
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* ========================================================
           TEXTO
           ======================================================== */
        .thanks-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #8A6F5A;
            margin-bottom: 15px;
        }
        
        .thanks-container .subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: #2F2F2F;
            margin-bottom: 10px;
        }
        
        .thanks-container .message {
            font-size: 1rem;
            opacity: 0.8;
            line-height: 1.8;
            margin-bottom: 8px;
        }
        
        .thanks-container .highlight-name {
            color: #8A6F5A;
            font-weight: 600;
        }
        
        .thanks-container .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #D8C3A5, #8A6F5A);
            margin: 20px auto;
            border-radius: 2px;
        }
        
        /* ========================================================
           INFORMAÇÕES ADICIONAIS
           ======================================================== */
        .thanks-info {
            background: #FAF8F5;
            border-radius: 16px;
            padding: 20px 25px;
            margin: 25px 0;
            text-align: left;
        }
        
        .thanks-info p {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.8;
            margin-bottom: 5px;
        }
        
        .thanks-info p:last-child {
            margin-bottom: 0;
        }
        
        .thanks-info strong {
            color: #8A6F5A;
        }
        
        .thanks-info a {
            color: #8A6F5A;
            text-decoration: none;
        }
        
        .thanks-info a:hover {
            text-decoration: underline;
        }
        
        /* ========================================================
           BOTÕES
           ======================================================== */
        .thanks-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #8A6F5A, #B08D57);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(138,111,90,0.3);
        }
        
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            background: transparent;
            color: #8A6F5A;
            border: 2px solid #D8C3A5;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: #D8C3A5;
            color: #2F2F2F;
            transform: translateY(-2px);
        }
        
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

        .btn-whatsapp:hover {

        }
        
        /* ========================================================
           ANIMAÇÕES
           ======================================================== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .delay-1 { animation-delay: 0.1s; opacity: 0; animation: fadeInUp 0.6s ease 0.1s forwards; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; animation: fadeInUp 0.6s ease 0.2s forwards; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; animation: fadeInUp 0.6s ease 0.3s forwards; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; animation: fadeInUp 0.6s ease 0.4s forwards; }
        .delay-5 { animation-delay: 0.5s; opacity: 0; animation: fadeInUp 0.6s ease 0.5s forwards; }

                padding: 12px 24px;
                font-size: 0.9rem;
                width: 100%;
            }
            
            .thanks-buttons {
                gap: 10px;
            }
        }
    </style>

    <!-- ========================================================
    SCRIPT DOS CONFETES
    ======================================================== -->
    <script>
        (function() {
            'use strict';

            // ========================================================
            // CONFIGURAÇÕES
            // ========================================================
            const CONFETTI_COUNT = 280;
            const COLORS = [
                '#8A6F5A', '#D8C3A5', '#B08D57', '#6D4C41', '#FAF8F5',
                '#E8D5B8', '#A88B76', '#C8B3A5', '#F5E6D3', '#9B7A64',
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
                '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9'
            ];
            const SHAPES = ['square', 'circle', 'triangle'];

            // ========================================================
            // CRIA UM CONFETE
            // ========================================================
            function createConfetti() {
                const container = document.getElementById('confetti-container');
                if (!container) return;

                const piece = document.createElement('div');
                piece.classList.add('confetti-piece');

                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                piece.style.backgroundColor = color;

                const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                if (shape === 'circle') {
                    piece.style.borderRadius = '50%';
                } else if (shape === 'triangle') {
                    piece.style.width = '0';
                    piece.style.height = '0';
                    piece.style.backgroundColor = 'transparent';
                    piece.style.borderLeft = '8px solid transparent';
                    piece.style.borderRight = '8px solid transparent';
                    piece.style.borderBottom = '14px solid ' + color;
                    piece.style.borderRadius = '0';
                }

                const size = Math.floor(Math.random() * 8) + 5;
                if (shape !== 'triangle') {
                    piece.style.width = size + 'px';
                    piece.style.height = size + 'px';
                } else {
                    piece.style.borderLeftWidth = (size / 2) + 'px';
                    piece.style.borderRightWidth = (size / 2) + 'px';
                    piece.style.borderBottomWidth = size + 'px';
                }

                const left = Math.random() * 100;
                piece.style.left = left + '%';

                const duration = (Math.random() * 3) + 2;
                piece.style.animationDuration = duration + 's';

                const delay = Math.random() * 2;
                piece.style.animationDelay = delay + 's';

                const rotation = Math.random() * 360;
                piece.style.transform = 'rotate(' + rotation + 'deg)';

                container.appendChild(piece);

                const totalTime = (parseFloat(duration) + parseFloat(delay)) * 1000;
                setTimeout(function() {
                    if (piece && piece.parentNode) {
                        piece.parentNode.removeChild(piece);
                    }
                }, totalTime + 100);
            }

            // ========================================================
            // INICIA OS CONFETES
            // ========================================================
            function launchConfetti() {
                for (let i = 0; i < CONFETTI_COUNT; i++) {
                    const delay = (i / CONFETTI_COUNT) * 1500;
                    setTimeout(createConfetti, delay);
                }

                setTimeout(function() {
                    for (let i = 0; i < 50; i++) {
                        setTimeout(createConfetti, i * 30);
                    }
                }, 2000);

                setTimeout(function() {
                    for (let i = 0; i < 30; i++) {
                        setTimeout(createConfetti, i * 50);
                    }
                }, 4000);
            }

            // ========================================================
            // INICIA QUANDO A PÁGINA CARREGAR
            // ========================================================
            if (document.readyState === 'complete') {
                launchConfetti();
            } else {
                window.addEventListener('load', launchConfetti);
            }
        })();
    </script>
